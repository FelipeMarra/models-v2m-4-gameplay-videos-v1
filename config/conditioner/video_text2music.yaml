# @package __global__

classifier_free_guidance:
  training_dropout: 0.3
  inference_coef: 3.0

attribute_dropout: {}

fuser:
  cross_attention_pos_emb: false
  cross_attention_pos_emb_scale: 1
  sum: []
  prepend: []
  cross: [description, video]
  input_interpolate: []

conditioners:
  description:
    model: t5
    t5:
      name: t5-base
      finetune: true
      word_dropout: 0.3
      normalize_text: false
  video:
    model: video
    video:
      name: google/vivit-b-16x2-kinetics400
      video_len: 32
      finetune: true
      num_hidden_layers: 6
      num_attention_heads: 6